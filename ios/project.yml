name: PersonalPodcast
options:
  bundleIdPrefix: nl.teamblender
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    API_BASE_URL: https://www.yourownpod.com
targets:
  PersonalPodcast:
    type: application
    platform: iOS
    sources:
      - PersonalPodcast
    resources:
      - path: PersonalPodcast/Resources/yourownpod-bg.mp4
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: PersonalPodcast/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: nl.teamblender.yourownpod
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: PersonalPodcast/PersonalPodcast.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BU2QV95AFM  # Teamblender
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
