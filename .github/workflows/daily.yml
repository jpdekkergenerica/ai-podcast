name: Dagelijkse podcast

on:
  schedule:
    - cron: "30 2 * * *"  # 02:30 UTC = 03:30/04:30 Nederlandse tijd, vóór de ochtendspits
  workflow_dispatch:
    inputs:
      feed_only:
        description: "Alleen de feed opnieuw bouwen en publiceren (geen nieuwe aflevering)"
        type: boolean
        default: false
      max_minutes:
        description: "Maximale duur in minuten voor deze run (leeg = instelling uit config.yaml)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Aflevering maken
        if: ${{ !inputs.feed_only }}
        env:
          MAX_MINUTES: ${{ inputs.max_minutes }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m podcast build

      - name: Alleen feed bouwen
        if: ${{ inputs.feed_only }}
        run: python -m podcast feed

      - name: MP3 publiceren als release
        if: hashFiles('out/tag.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat out/tag.txt)
          gh release create "$tag" "out/${tag#ep-}.mp3" --title "$tag" --notes "Automatisch gegenereerd"

      - name: Episodelijst opslaan
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add episodes.json covered.json pronunciation.json
          if ! git diff --cached --quiet; then
            git commit -m "Aflevering toegevoegd"
            # main kan intussen zijn gewijzigd; dan eerst rebasen (bij een conflict wint de bot-versie)
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi

      - name: Audio op de site zetten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/site/audio
          python -c "import json,yaml;n=yaml.safe_load(open('config.yaml'))['podcast']['keep_episodes'];[print(e['tag'],e['file']) for e in json.load(open('episodes.json'))[:n]]" |
          while read tag file; do
            if [ -f "out/$file" ]; then cp "out/$file" out/site/audio/; else gh release download "$tag" -p "$file" -D out/site/audio; fi
          done
          ls -l out/site/audio

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - id: deploy
        uses: actions/deploy-pages@v4
