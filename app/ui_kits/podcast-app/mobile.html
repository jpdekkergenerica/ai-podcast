<!doctype html>
<html lang="nl"><head>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicon-192.png">
<link rel="shortcut icon" href="../../assets/favicon.ico">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>yourownpod</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_dev/ds-loader.js"></script>
<script>
  // Zelfde origin als de API wanneer geserveerd via /app/…
  window.PODCAST_API_BASE = window.PODCAST_API_BASE || (
    /^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.port !== "8000" ? "http://127.0.0.1:8000" : location.origin);
</script>
<style>
  html, body, #root { height: 100%; margin: 0; background: var(--bg-primary); }
  html, body { position: fixed; inset: 0; width: 100%; overflow: hidden; } /* het document scrolt niet; elk scherm heeft een eigen scrollgebied */
  #root { box-sizing: border-box; padding-top: env(safe-area-inset-top); }
  body { overscroll-behavior: none; }
  [data-scroll], div { -webkit-overflow-scrolling: touch; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
MonseyLoad(["ui_kits/podcast-app/App.jsx"]).then(({ App }) => {
  const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  ReactDOM.createRoot(document.getElementById("root")).render(
    <App framed={false} theme={dark ? "dark" : "light"} />
  );
});
</script>
</body></html>
