# DigitalOcean App Platform-spec voor YourOwnPod.
# Toepassen:  doctl apps update <APP_ID> --spec .do/app.yaml   (of plak in Settings > App Spec)
# Geheimen (waarden met type: SECRET) vul je in de DO-console in; zet ze niet in dit bestand.
name: yourownpod
region: ams

# Geheimen staan op app-niveau (Settings > App-Level Environment Variables) en gelden voor api en worker.
# Zet ze niet nog eens per component: een lege waarde daar overschrijft die van app-niveau.
envs:
  - { key: API_JWT_SECRET, scope: RUN_TIME, type: SECRET }
  - { key: SPACES_KEY, scope: RUN_TIME, type: SECRET }
  - { key: SPACES_SECRET, scope: RUN_TIME, type: SECRET }
  - { key: ANTHROPIC_API_KEY, scope: RUN_TIME, type: SECRET }
  - { key: ELEVENLABS_API_KEY, scope: RUN_TIME, type: SECRET }

databases:
  - name: db
    engine: PG
    version: "16"
    production: false        # dev-database; zet op true en vul cluster_name voor een beheerd productiecluster

services:
  - name: api
    github:
      repo: jpdekkergenerica/ai-podcast
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.api
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: AUTH_DEV_MODE, scope: RUN_TIME, value: "0" }
      - { key: PUBLIC_BASE_URL, scope: RUN_TIME, value: "${APP_URL}" }  # vervang door je eigen domein als dat er is
      - { key: CORS_ORIGINS, scope: RUN_TIME, value: "*" }
      - { key: STORAGE_ROOT, scope: RUN_TIME, value: /tmp/storage }
      - { key: SPACES_BUCKET, scope: RUN_TIME, value: yourownpod-media }
      - { key: SPACES_REGION, scope: RUN_TIME, value: ams3 }
      - { key: APPLE_CLIENT_ID, scope: RUN_TIME, value: nl.generica.personalpodcast }

workers:
  - name: worker
    github:
      repo: jpdekkergenerica/ai-podcast
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile.api
    run_command: python -m worker.run loop --sleep 5
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1         # laat dit op 1 staan: de wachtrij is niet ontworpen voor meerdere workers
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: PUBLIC_BASE_URL, scope: RUN_TIME, value: "${APP_URL}" }
      - { key: STORAGE_ROOT, scope: RUN_TIME, value: /tmp/storage }
      - { key: SPACES_BUCKET, scope: RUN_TIME, value: yourownpod-media }
      - { key: SPACES_REGION, scope: RUN_TIME, value: ams3 }
      - { key: APNS_BUNDLE_ID, scope: RUN_TIME, value: nl.generica.personalpodcast }
      - { key: APNS_USE_SANDBOX, scope: RUN_TIME, value: "0" }
