podcast:
  title: "Nynke's Podcast"
  description: "Elke ochtend een persoonlijke, automatisch samengestelde nieuwspodcast over de interessegebieden van Nynke."
  author: "Generica"
  email: "j.p.dekker@generica.nl"            # Apple controleert dit adres bij het aanmelden; het staat publiek in de feed
  language: "nl"
  call_to_action: "Stuur deze aflevering door naar één persoon die ook wil bijblijven."  # precies één concrete oproep aan het eind
  repository: "jpdekkergenerica/ai-podcast"      # alleen voor lokaal draaien; in GitHub Actions wordt dit automatisch gevuld

duration:
  max_minutes: 15          # bovengrens van de aflevering
  item_minutes_top: 3.0    # spreektijd voor een bericht met score 10 (de aflevering wordt hierna op max_minutes geschaald)
  item_minutes_floor: 1.0  # spreektijd voor een bericht op de minimumscore
  max_stretch: 2.0         # hooguit zoveel keer uitgebreider als er te weinig nieuws is om de tijd te vullen
  intro_outro_minutes: 2.5 # haak, showintro en synthese; wordt van max_minutes afgetrokken
  words_per_minute: 150    # spreektempo voor het woordbudget

relevance:
  lookback_hours: 96       # alleen berichten van de afgelopen X uur (ruim, voor nicheonderwerpen; herhaling wordt apart tegengehouden)
  min_item_score: 3        # nooit onder deze score; zwakkere berichten komen alleen aan bod als er tijd te vullen is
  coverage_min_score: 6    # een onderwerp met een bericht van deze score of hoger komt altijd aan bod
  topic_decay: 0.7         # extra bericht van hetzelfde onderwerp telt zoveel punten minder (verdeelt de tijd eerlijker)
  max_topics: 5            # 2 tot 4 inhoudelijke blokken per aflevering
  max_items_per_topic: 8
  focus: "Nederland"        # nieuws zonder duidelijke link met deze regio krijgt een lage score
  repeat_days: 7           # nieuws dat de afgelopen X dagen al is besproken komt niet terug (ook niet via een andere bron)
  max_candidates_per_topic: 25

models:
  scoring: "claude-haiku-5-5"
  script: "claude-sonnet-5-5"

voice:
  voice_id: "dLPO5AsXc3FZDbTh1IKa"   # vervang door een stem uit jouw ElevenLabs-bibliotheek
  model_id: "eleven_multilingual_v2" # "eleven_flash_v2_5" is ~2x goedkoper, iets minder natuurlijk
  settings:                          # lagere stability + meer style = levendiger, minder voorleesklank
    stability: 0.4
    similarity_boost: 0.75
    style: 0.3
    use_speaker_boost: true

# Een onderwerp mag terugkeren; hetzelfde nieuws niet (ook niet via een andere bron).
# 'keywords' (regex, hoofdletterongevoelig) filtert de feeds op titel + samenvatting; zonder keywords komt alles mee.
topics:
  - name: "Dakloosheid en maatschappelijke opvang"
    description: "Ontwikkelingen rond dakloosheid, buitenslapers, Housing First, straatzorg, ETHOS-tellingen en vernieuwende vormen van opvang en begeleiding in Nederland. Extra aandacht voor Groningen en Noord-Nederland."
    keywords: ["\\bdaklo", "buitenslaper", "maatschappelijke opvang", "nachtopvang", "housing first", "straatzorg", "thuisloos", "ethos", "zwerfjongere", "onderdak"]
    feeds:
      - https://feeds.nos.nl/nosnieuwsbinnenland
      - https://www.nu.nl/rss/Algemeen
      - https://www.ad.nl/rss.xml
