podcast:
  title: "Mijn Dagelijkse Briefing"
  description: "Elke ochtend een persoonlijke, automatisch samengestelde nieuwspodcast over mijn interessegebieden."
  author: "JP"
  email: "j.p.dekker@generica.nl"            # Apple controleert dit adres bij het aanmelden; het staat publiek in de feed
  language: "nl"
  call_to_action: "Stuur deze aflevering door naar één persoon die ook wil bijblijven."  # precies één concrete oproep aan het eind
  repository: "jpdekkergenerica/ai-podcast"      # alleen voor lokaal draaien; in GitHub Actions wordt dit automatisch gevuld

duration:
  max_minutes: 15          # bovengrens van de aflevering
  max_minutes_per_item: 2.0 # rem: meer spreektijd per bericht dan dit wordt niet gebruikt (de aflevering kan dan korter zijn)
  intro_outro_minutes: 2.5 # haak, showintro en synthese; wordt van max_minutes afgetrokken
  words_per_minute: 150    # spreektempo voor het woordbudget

relevance:
  lookback_hours: 36       # alleen berichten van de afgelopen X uur
  min_item_score: 6        # berichten onder deze score worden niet besproken
  max_topics: 4            # 2 tot 4 inhoudelijke blokken per aflevering
  max_items_per_topic: 8
  max_candidates_per_topic: 25

models:
  scoring: "claude-haiku-5-5"
  script: "claude-sonnet-5-5"

voice:
  voice_id: "dLPO5AsXc3FZDbTh1IKa"   # vervang door een stem uit jouw ElevenLabs-bibliotheek
  model_id: "eleven_multilingual_v2" # "eleven_flash_v2_5" is ~2x goedkoper, iets minder natuurlijk
  settings:                          # lagere stability + meer style = levendiger, minder voorleesklank
    stability: 0.4
    similarity_boost: 0.75
    style: 0.3
    use_speaker_boost: true

# Pas de interessegebieden vrij aan. 'description' vertelt Claude wat jij relevant vindt.
topics:
  - name: "De midterms in Amerika"
    description: "De Amerikaanse tussentijdse verkiezingen (Congres, Senaat, gouverneurs): peilingen, spannende races, uitslagen, campagnes en de gevolgen voor het beleid van Trump."
    feeds:
      - https://feeds.npr.org/1014/rss.xml
      - https://www.theguardian.com/us-news/us-politics/rss
      - https://rss.politico.com/politics-news.xml
      - https://feeds.nos.nl/nosnieuwsbuitenland
  - name: "AI-nieuws"
    description: "Het belangrijkste algemene AI-nieuws: nieuwe modellen, doorbraken, grote bedrijven (Anthropic, OpenAI, Google, Meta), regelgeving, investeringen en maatschappelijke impact."
    feeds:
      - https://techcrunch.com/category/artificial-intelligence/feed/
      - https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
      - https://tweakers.net/feeds/nieuws.xml
  - name: "Nieuwe AI-toepassingen"
    description: "Spraakmakende, net gelanceerde AI-producten, apps en tools die veel aandacht krijgen of echt iets nieuws kunnen. Geen kleine updates of vage aankondigingen."
    feeds:
      - https://www.producthunt.com/feed?category=artificial-intelligence
      - https://hnrss.org/show?q=AI
      - https://techcrunch.com/category/artificial-intelligence/feed/
  - name: "Nederlandse politiek"
    description: "Landelijke politiek in Nederland: kabinet, Tweede Kamer, coalitie en oppositie, wetgeving en politieke ophef."
    feeds:
      - https://feeds.nos.nl/nosnieuwspolitiek
      - https://www.nu.nl/rss/Politiek
